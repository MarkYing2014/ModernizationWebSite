[tool.poetry]
name = "api-gateway"
version = "0.1.0"
description = "API Gateway for the ModernizationWebSite Platform"
authors = ["ModernizationWebSite Team <dev@modernization.ai>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlmodel = "^0.0.14"
pydantic = {extras = ["email"], version = "^2.5.0"}
alembic = "^1.13.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["argon2"], version = "^1.7.4"}
python-multipart = "^0.0.9"
redis = "^5.0.1"
httpx = "^0.26.0"
websockets = "^12.0"
psycopg2-binary = "^2.9.9"
pydantic-settings = "^2.1.0"
prometheus-fastapi-instrumentator = "^6.1.0"
tenacity = "^8.2.3"
structlog = "^24.1.0"
sentry-sdk = {extras = ["fastapi"], version = "^1.39.0"}
minio = "^7.2.0"
neo4j = "^5.15.0"
email-validator = "^2.1.0"
gunicorn = "^21.2.0"
python-dotenv = "^1.0.0"
aioredis = "^2.0.1"
bcrypt = "^4.1.2"
zxcvbn = "^4.4.28"
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
aiocache = "^0.12.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.23.2"
pytest-mock = "^3.12.0"
ruff = "^0.1.11"
black = "^24.1.0"
isort = "^5.13.2"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
httpx = "^0.26.0"
pytest-env = "^1.1.1"
faker = "^22.0.0"
types-python-jose = "^3.3.4.8"
types-passlib = "^1.7.7.13"
types-redis = "^4.6.0.11"
pytest-xdist = "^3.5.0"
bandit = "^1.7.5"
safety = "^2.3.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml:coverage.xml"
asyncio_mode = "auto"
env = [
    "ENVIRONMENT=test",
    "POSTGRES_URL=postgresql://postgres:postgres@localhost:5432/test_db",
    "REDIS_URL=redis://localhost:6379/1",
    "JWT_SECRET=test_secret_key_not_for_production",
    "LOG_LEVEL=DEBUG",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "B", "I", "N", "UP", "ANN", "S", "A", "C4", "T20", "RET", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "ANN"]
"alembic/*" = ["ANN"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
